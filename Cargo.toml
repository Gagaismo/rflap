[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/Gagaismo/rflap"
authors = ["Lautaro (Gagaismo)"]

[workspace.dependencies]
rflap-core = { path = "crates/rflap-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
